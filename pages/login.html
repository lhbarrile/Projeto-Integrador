<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMS - Human Nutrition</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
</head>
<body>
    <div class="login">
        <h1>GMS - Human Nutrition</h1>
        <p>Acesse o sistema de gestão</p>
        <div class="form">
            <form>
                <div class="div-form">
                    <label for="email-input">Email:</label>
                    <div class="div-input">
                        <input type="email" id="email-input" name="email" placeholder="Digite seu Email:" required>
                    </div>
                </div>
                
                <div class="div-form">
                    <label for="password-input">Senha:</label>
                    <div class="div-input">
                        <input type="password" id="password-input" name="password" placeholder="Digite sua senha: " required>
                    </div>
                </div>
                
                <div class="div-botao">
                    <button class="btn-entrar">Entrar</button>
                </div>
                <div class="div-botao">
                    <button class="btn-cadastro">Cadastre-se</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
